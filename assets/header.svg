<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Omar El-Bayoumi, Odoo Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0f1f2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="1" r="0.55">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="20" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="20" fill="url(#glow1)"/>
  <rect width="1200" height="300" rx="20" fill="url(#glow2)"/>
  <rect x="1" y="1" width="1198" height="298" rx="19" fill="none" stroke="url(#accent)" stroke-opacity="0.45" stroke-width="2"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="72" y="92" fill="#7dd3fc" font-size="20" letter-spacing="3" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">&lt;odoo-developer /&gt;</text>
    <text x="70" y="160" fill="#f8fafc" font-size="64" font-weight="700">Omar El-Bayoumi</text>
    <rect x="72" y="182" width="96" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="72" y="228" fill="#cbd5e1" font-size="24">Custom Odoo modules · Odoo websites &amp; themes · OWL · Python</text>
    <text x="72" y="262" fill="#64748b" font-size="18">Odoo 14–19 · Arabic &amp; English · b-code.tech</text>
  </g>

  <g transform="translate(870 72)" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15">
    <rect width="270" height="156" rx="14" fill="#0b1220" fill-opacity="0.8" stroke="#1e293b"/>
    <circle cx="20" cy="20" r="5" fill="#f87171"/>
    <circle cx="38" cy="20" r="5" fill="#fbbf24"/>
    <circle cx="56" cy="20" r="5" fill="#34d399"/>
    <text x="20" y="60" xml:space="preserve"><tspan fill="#c084fc">class</tspan><tspan fill="#22d3ee"> Omar</tspan><tspan fill="#e2e8f0">(models.Model):</tspan></text>
    <text x="20" y="88" xml:space="preserve"><tspan fill="#e2e8f0">    _name = </tspan><tspan fill="#34d399">'odoo.dev'</tspan></text>
    <text x="20" y="116" xml:space="preserve"><tspan fill="#e2e8f0">    stack = [</tspan><tspan fill="#34d399">'py'</tspan><tspan fill="#e2e8f0">, </tspan><tspan fill="#34d399">'owl'</tspan><tspan fill="#e2e8f0">]</tspan></text>
    <text x="20" y="140" fill="#64748b" xml:space="preserve">    # build. ship. repeat.</text>
  </g>
</svg>
